<style>

</head>
<body>
<div class="page">
  <a class="back-link" href="../">← 診断ファイル室</a>
  <div class="tab">16の性格タイプ診断ファイル</div>
  <div class="file-body">

    <section class="screen intro" id="screen-intro">

    </section>

    <section class="screen quiz" id="screen-quiz" hidden>

      <div class="yn-options">

        <button class="yn-btn" id="no-btn" type="button">いいえ</button>
      </div>
      <button class="btn ghost back-btn" id="back-btn" type="button" hidden>← 前の質問に戻る</button>
    </section>

    <section class="screen result" id="screen-result" hidden>
      <div class="stamp-wrap">
        <img class="type-icon" id="type-icon" src="" alt="タイプのイラスト">
        <svg class="stamp" id="stamp-svg" viewBox="0 0 200 200" role="img" aria-label="診断結果のスタンプ">

              <stop offset="100%" stop-color="#a6abff"/>

      </div>
      <p class="eyebrow" style="text-align:center;">診断結果</p>
      <h1 class="result-name" id="result-name"></h1>
      <p class="result-code" id="result-code"></p>
      <p class="result-motto" id="result-motto"></p>

      <div class="field">
        <span class="field-label">特徴</span>
        <ul class="traits" id="result-traits"></ul>
      </div>
      <div class="field">
        <span class="field-label">周りからはこう見られている</span>
        <p id="result-seen"></p>
      </div>
      <div class="field">
        <span class="field-label">ちょっと注意</span>
        <p id="result-caution"></p>
      </div>
      <div class="field accent-field">
        <span class="field-label">相性がいいタイプ</span>
        <p id="result-match"></p>
      </div>
      <div class="field">
        <span class="field-label">少し歩み寄りが必要なタイプ</span>
        <p id="result-weak"></p>
      </div>

      <div class="field ad-field" id="result-ad-field" hidden>
        <span class="field-label pr-label" id="pr-label">PR ー おすすめの一品</span>
        <div id="result-ad" class="ad-embed"></div>
      </div>

      <div class="result-actions">
        <button class="btn share" id="share-btn" type="button">

        <button class="btn ghost" id="retry-btn" type="button">もう一度診断する</button>
      </div>
    </section>

  </div>
</div>

      traits: ["大きな目標を描くのが得意", "決断力がある"],
      seen: "「頼れる」「カリスマ性がある」と思われています。",
      caution: "周りのペースを置き去りにしがち。",
      match: "INFP 夢想家 — あなたの目標に、心をこめてくれる相手です。",
      weak: "ISFP 芸術家 — マイペースな進め方に、もどかしさを感じることがある相手です。" }
  };

  const TYPE_COLORS = {
    ISTJ: "#a3341f", ISFJ: "#d98ca6", INFJ: "#6b4e9e", INTJ: "#2c3e6b",
    ISTP: "#6b7280", ISFP: "#a78bd6", INFP: "#7fc4d9", INTP: "#2f6b4f",
    ESTP: "#e07a2b", ESFP: "#e8b800", ENFP: "#e0654f", ENTP: "#1fa5a0",
    ESTJ: "#7a1f2b", ESFJ: "#d9748e", ENFJ: "#b8912b", ENTJ: "#a0122a"
  };

  let current = 0;
  let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
  const answers = new Array(QUESTIONS.length).fill(null);

  const introScreen = document.getElementById("screen-intro");
  const quizScreen = document.getElementById("screen-quiz");
  const resultScreen = document.getElementById("screen-result");
  const backBtn = document.getElementById("back-btn");
  const yesBtn = document.getElementById("yes-btn");
  const noBtn = document.getElementById("no-btn");

  document.getElementById("start-btn").addEventListener("click", () => {
    introScreen.hidden = true;
    quizScreen.hidden = false;
    renderQuestion();
  });

  function renderQuestion() {
    const q = QUESTIONS[current];
    document.getElementById("qcount").textContent = `Q.${current + 1} / ${QUESTIONS.length}`;
    document.getElementById("progress-fill").style.width = `${(current / QUESTIONS.length) * 100}%`;
    document.getElementById("question-text").textContent = q.text;
    yesBtn.classList.toggle("selected", answers[current] === q.yes);
    noBtn.classList.toggle("selected", answers[current] === q.no);
    backBtn.hidden = current === 0;
  }

  function answer(letter) {
    if (answers[current] != null) {
      scores[answers[current]] -= 1;
    }
    scores[letter] += 1;
    answers[current] = letter;
    current += 1;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  document.getElementById("yes-btn").addEventListener("click", () => answer(QUESTIONS[current].yes));
  document.getElementById("no-btn").addEventListener("click", () => answer(QUESTIONS[current].no));
  backBtn.addEventListener("click", () => {
    if (current > 0) {
      current -= 1;
      renderQuestion();
    }
  });

  function showResult() {
    const code = (scores.E > scores.I ? "E" : "I")
      + (scores.S > scores.N ? "S" : "N")
      + (scores.T > scores.F ? "T" : "F")
      + (scores.J > scores.P ? "J" : "P");
    const t = TYPES[code];

    document.getElementById("stamp-text").textContent = t.stamp;
    const iconEl = document.getElementById("type-icon");
    iconEl.src = `icons/${code.toLowerCase()}.jpg`;
    iconEl.alt = `${t.name}のイラスト`;
    iconEl.style.setProperty("--type-color", TYPE_COLORS[code]);
    document.getElementById("result-name").textContent = t.name;
    document.getElementById("result-code").textContent = code;
    document.getElementById("result-motto").textContent = t.motto;
    document.getElementById("result-traits").innerHTML = t.traits.map(x => `<li>${x}</li>`).join("");
    document.getElementById("result-seen").textContent = t.seen;
    document.getElementById("result-caution").textContent = t.caution;
    document.getElementById("result-match").textContent = t.match;
    document.getElementById("result-weak").textContent = t.weak;

    const adField = document.getElementById("result-ad-field");
    const adEl = document.getElementById("result-ad");
    const prLabel = document.getElementById("pr-label");
    if (t.ad) {
      adEl.innerHTML = t.ad;
      prLabel.textContent = `PR ー ${t.name}のあなたにおすすめの一品`;
      adField.hidden = false;
    } else {
      adEl.innerHTML = "";
      adField.hidden = true;
    }

    document.getElementById("share-btn").onclick = () => {
      const text = `【16の性格タイプ診断】私は「${t.name}（${code}）」でした！\n${t.motto}\n`;
      const url = location.href.split("?")[0];
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, "_blank");
    };
    document.getElementById("retry-btn").onclick = () => location.reload();

    quizScreen.hidden = true;
    resultScreen.hidden = false;
  }
</script>
</body>
</html>
