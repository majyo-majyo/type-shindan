<!doctype html>

<style>

  @media (prefers-color-scheme: dark) {

      --paper: #201c2c; --paper-deep: #262233; --card: #262233; --card-line: #3c3650;
      --ink: #f1eefb; --ink-soft: #bdb6da; --muted: #8c85ab;
      --accent: #8fd67a; --accent-soft: rgba(143, 214, 122, 0.16); --accent-line: rgba(143, 214, 122, 0.4);
      --shadow: rgba(0, 0, 0, 0.45); --focus: #b8b2ff;
    }
  }

  :root[data-theme="dark"] {
    --bg1: #2a2138; --bg2: #1f2438; --bg3: #2a2820;
    --paper: #201c2c; --paper-deep: #262233; --card: #262233; --card-line: #3c3650;
    --ink: #f1eefb; --ink-soft: #bdb6da; --muted: #8c85ab;
    --accent: #8fd67a; --accent-soft: rgba(143, 214, 122, 0.16); --accent-line: rgba(143, 214, 122, 0.4);

  body {
    margin: 0;
    min-height: 100vh;
    background:

  @media (prefers-color-scheme: dark) {

  .page {

  .back-link {

    gap: 6px;

    font-size: 12px;
    color: var(--muted);

  .back-link:hover { color: var(--accent); }
  .back-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .tab {

    gap: 6px;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted);

  .file-body {

    border-radius: 22px;

  .screen[hidden] { display: none; }

  .eyebrow {
    display: inline-block;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #fff;
    background: linear-gradient(120deg, var(--accent), #b4e08f);
    padding: 5px 14px;
    border-radius: 999px;
    margin: 0 0 16px;
  }

  h1 {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.4;
    margin: 0 0 18px;
    text-wrap: balance;
  }

  .lead {
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-soft);
    margin: 0 0 32px;
    max-width: 46ch;
  }

  .btn {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 999px;
    padding: 14px 32px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }

  .btn.primary {
    background: var(--accent);
    color: #fdf6e8;
    box-shadow: 0 8px 20px -8px var(--accent-line);
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px var(--accent-line); }

  .btn.ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--card-line);
    margin-top: 8px;
  }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .quiz-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .qcount {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .progress {
    flex: 1;
    height: 6px;
    background: var(--paper-deep);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--card-line);
  }

  .progress-fill {
    height: 100%;
    width: 12.5%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }

  .question {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 4vw, 21px);
    line-height: 1.6;
    margin: 0 0 26px;
    text-wrap: balance;

  .options {

    flex-direction: column;
    gap: 10px;

  .option {

    align-items: baseline;
    gap: 14px;
    text-align: left;
    width: 100%;
    background: var(--paper);
    border: 2px solid var(--card-line);
    border-radius: 16px;
    padding: 15px 18px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);

    background: var(--accent-soft);

    height: 22px;

    align-items: center;

  .stamp {

    height: 150px;
    opacity: 0;
    transform: scale(2.2) rotate(-16deg);

  .stamp.show {

    .stamp.show { animation: none; opacity: 1; transform: scale(1) rotate(-6deg); }

    55%  { opacity: 1; transform: scale(0.92) rotate(-4deg); }
    75%  { transform: scale(1.05) rotate(-8deg); }

  .result-name {

    margin: 0 0 30px;

    height: auto;
    aspect-ratio: 1024 / 558;

    border-radius: 16px;
    border: 2px solid var(--card-line);
    margin: 0 0 28px;

  .meter {

  .meter-track {

    height: 10px;
    background: var(--paper-deep);

  .meter-fill {

    .meter-fill { transition: none; }

  .meter-labels {

    justify-content: space-between;

    font-size: 11px;

  .field {
    border-top: 1px dashed var(--card-line);

  .field:last-of-type { border-bottom: 1px dashed var(--card-line); }

  .field-label {
    display: inline-block;
    font-family: "M PLUS Rounded 1c", sans-serif;

  .traits {

    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .traits li {
    font-size: 14.5px;
    line-height: 1.7;
    padding-left: 18px;
    position: relative;
  }

  .traits li::before {
    content: "・";
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  .field.accent-field {
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 16px 16px;
    border-top: none;
    margin-top: 8px;
  }
  .field.accent-field:last-of-type { border-bottom: none; }

  .ad-field {
    border-top: 1px dashed var(--card-line);
  }

  .pr-label {
    background: var(--paper-deep);
    color: var(--muted);

  .ad-embed {
    display: flex;
    justify-content: center;
    overflow-x: auto;
    padding-top: 4px;

  .ad-embed table {
    max-width: 100%;

  .ad-embed, .ad-embed * {

    border-color: var(--card-line) !important;

  .ad-embed a {
    color: var(--accent) !important;
    text-decoration: underline;
  }

  .result-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  .btn.share {

  @media (max-width: 480px) {
    .file-body { padding: 28px 20px 26px; }
  }
</style>

    requestAnimationFrame(() => { meterFill.style.width = `${percent}%`; });

    document.getElementById("share-btn").onclick = () => {
      const shareText = `私のたのピク度は${percent}%「${t.name}」でした！あなたは何%？\n#たのピク度診断 #たのピク`;
      const shareUrl = location.href.split("?")[0];
      const intent = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
      window.open(intent, "_blank", "noopener,noreferrer");
    };
  }
</script>
</body>
</html>
