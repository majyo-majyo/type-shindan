<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断ファイル室</title>
<meta name="description" content="8つの質問で職場タイプがわかる診断など、いろいろなタイプ診断をまとめたポータルサイトです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #e7dcbd;
    --paper-deep: #d5c496;
    --card: #f7f1df;
    --card-line: #c8b688;
    --ink: #2c241a;
    --ink-soft: #6b5c40;
    --muted: #8a7a56;
    --accent: #a3341f;
    --accent-soft: rgba(163, 52, 31, 0.1);
    --accent-line: rgba(163, 52, 31, 0.35);
    --shadow: rgba(44, 36, 26, 0.18);
    --focus: #1c5f7a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18150f;
      --paper-deep: #100e0a;
      --card: #221d15;
      --card-line: #493e29;
      --ink: #ede2c8;
      --ink-soft: #b6a582;
      --muted: #8c7c5b;
      --accent: #e2725a;
      --accent-soft: rgba(226, 114, 90, 0.14);
      --accent-line: rgba(226, 114, 90, 0.4);
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #6fb8d6;
    }
  }

  :root[data-theme="dark"] {
    --paper: #18150f;
    --paper-deep: #100e0a;
    --card: #221d15;
    --card-line: #493e29;
    --ink: #ede2c8;
    --ink-soft: #b6a582;
    --muted: #8c7c5b;
    --accent: #e2725a;
    --accent-soft: rgba(226, 114, 90, 0.14);
    --accent-line: rgba(226, 114, 90, 0.4);
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #6fb8d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--card-line) 27.5px, transparent 28px),
      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px 64px;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  header {
    margin-bottom: 40px;
    text-align: center;
  }

  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin: 0 0 14px;
    text-transform: uppercase;
  }

  h1 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.4;
    margin: 0 0 14px;
    text-wrap: balance;
  }

  .lead {
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 44ch;
  }

  .shelf {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .file-card {
    display: block;
    text-decoration: none;
    color: inherit;
    position: relative;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    padding: 8px 18px 10px;
    border-radius: 8px 8px 0 0;
    margin-left: 28px;
    border: 1px solid var(--card-line);
    border-bottom: none;
  }

  .tab::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .file-body {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 4px 14px 14px 14px;
    box-shadow: 0 14px 32px -18px var(--shadow), 0 2px 0 var(--card-line);
    padding: 26px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .file-body { transition: none; }
  }

  .file-card:hover .file-body {
    transform: translateX(4px);
    box-shadow: 0 18px 36px -16px var(--shadow), 0 2px 0 var(--accent-line);
  }

  .file-card:focus-visible .file-body {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }

  .file-info h2 {
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 8px;
  }

  .file-info p {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0;
    max-width: 40ch;
  }

  .file-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    letter-spacing: 0.04em;
  }

  .arrow {
    flex: none;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    color: var(--accent);
  }

  .placeholder {
    border: 1px dashed var(--card-line);
    border-radius: 4px 14px 14px 14px;
    padding: 26px 28px;
    margin-left: 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px) {
    .file-body { flex-direction: column; align-items: flex-start; padding: 22px 22px; }
    .arrow { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Diagnosis Files</p>
    <h1>診断ファイル室</h1>
    <p class="lead">気になる診断を選んで、ファイルを開いてください。8つほどの質問に直感で答えるだけで、あなたに近いタイプがわかります。</p>
  </header>

  <div class="shelf">
    <a class="file-card" href="./workplace-type/">
      <div class="tab">FILE 01 — 職場タイプ診断</div>
      <div class="file-body">
        <div class="file-info">
          <h2>職場タイプ診断</h2>
          <p>仕事中のふるまいから、司令塔・参謀・発明家など6タイプの中からあなたの働き方スタイルを診断します。</p>
          <div class="file-meta">全8問 ・ 所要時間1〜2分</div>
        </div>
        <div class="arrow">→</div>
      </div>
    </a>

    <div class="placeholder">
      次のファイルを準備中です
    </div>
  </div>

  <footer>診断ファイル室</footer>
</div>
</body>
</html>
